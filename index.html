<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>当番割り当てアプリ</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --blue:#1565C0;--text:#1A237E;--text-sub:#5C6BC0;
  --r1:22px;--r2:20px;--r3:28px;
  --cw-cls:54px;--cw-name:82px;--cw-code:22px;
  --cw-total:26px;
  --left1:0px;--left2:54px;--left3:136px;
}
body{font-family:'Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
  background:#EEF4FF;min-height:100vh;color:var(--text);-webkit-tap-highlight-color:transparent}

/* HEADER */
.hdr{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,#1565C0,#42A5F5);
  padding:8px 10px;box-shadow:0 4px 16px rgba(21,101,192,.3)}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;gap:6px}
.hdr-title{font-size:13px;font-weight:900;color:white;white-space:nowrap}
.hdr-btns{display:flex;gap:4px;flex-shrink:0}
.hbtn{border:none;border-radius:9px;padding:5px 8px;font-size:11px;font-weight:700;
  cursor:pointer;font-family:inherit;transition:opacity .18s;white-space:nowrap}
.hbtn-auto{background:linear-gradient(135deg,#FF6B9D,#FFA726);color:white}
.hbtn-csv{background:rgba(255,255,255,.2);color:white;border:1.5px solid rgba(255,255,255,.4)}
.hbtn-leg{background:rgba(255,255,255,.18);color:white;border:1.5px solid rgba(255,255,255,.3)}
.hbtn-cfg{background:rgba(255,255,255,.18);color:white;width:30px;height:30px;padding:0;
  display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:14px}
.hbtn:hover{opacity:.82}
.mnav{display:flex;align-items:center;justify-content:center;gap:12px}
.marr{background:rgba(255,255,255,.22);border:none;border-radius:50%;
  width:28px;height:28px;font-size:17px;color:white;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.mlbl{font-size:15px;font-weight:900;color:white;min-width:120px;text-align:center}

/* TABLE WRAP */
.twrap{overflow:auto;height:calc(100vh - 88px);-webkit-overflow-scrolling:touch;
  background:#EEF4FF}

/* TABLE BASE */
table{border-collapse:collapse;background:white;table-layout:fixed}
th,td{border:1px solid #DDE;font-size:11px;font-weight:600;
  white-space:nowrap;text-align:center;vertical-align:middle;overflow:hidden}

/* STICKY LEFT COLS */
.cc{position:sticky;left:var(--left1);z-index:10;
  width:var(--cw-cls);min-width:var(--cw-cls);max-width:var(--cw-cls);
  background:#EEF4FF;border-right:2px solid #B0BEC5;text-align:left;
  padding:2px 4px;font-size:10px;font-weight:900;color:var(--text-sub)}
.cn{position:sticky;left:var(--left2);z-index:10;
  width:var(--cw-name);min-width:var(--cw-name);max-width:var(--cw-name);
  background:white;padding:2px 5px;text-align:left;font-size:11px}
.cd{position:sticky;left:var(--left3);z-index:10;
  width:var(--cw-code);min-width:var(--cw-code);max-width:var(--cw-code);
  background:white;font-size:9px;color:#78909C}

thead .cc,thead .cn,thead .cd{z-index:25;background:linear-gradient(135deg,#1E88E5,#7986CB);
  color:white;border-color:#5C9CE6}

/* STICKY RIGHT COLS */
.ctot{position:sticky;right:0;z-index:10;
  width:var(--cw-total);min-width:var(--cw-total);max-width:var(--cw-total);
  background:#FFF8E1;border-left:2px solid #FFE082;
  font-size:11px;font-weight:900;color:#E65100}
thead .ctot{background:linear-gradient(135deg,#F57F17,#FFB300);color:white;z-index:25}

/* DATE HEADER CELLS */
.hd{width:26px;min-width:26px;max-width:26px;padding:1px 0}
.hr1 th{position:sticky;top:0;z-index:15}
.hr2 th{position:sticky;top:var(--r1);z-index:15}
.hr3 th{position:sticky;top:calc(var(--r1) + var(--r2));z-index:15}
thead .cc,thead .cn,thead .cd{z-index:26}
.hr1 .hd{height:var(--r1);font-size:12px;font-weight:900;background:#F0F7FF}
.hr2 .hd{height:var(--r2);font-size:10px;font-weight:700;background:#F0F7FF}
.hr3 .hd{height:var(--r3);font-size:9px;background:#FAFBFF;cursor:pointer;vertical-align:top;padding-top:2px}
.hr3 .hd:hover{background:#EEF4FF}

/* Weekday colors */
.d-sat{background:#EEF4FF!important;color:#1565C0}
.d-sun,.d-hol{background:#FFF0F0!important;color:#C62828;cursor:default!important}
.d-tod{background:#E8F5E9!important}
.hr1 .d-sat .dnum,.hr2 .d-sat{color:#1565C0!important}
.hr1 .d-sun .dnum,.hr2 .d-sun,.hr1 .d-hol .dnum,.hr2 .d-hol{color:#C62828!important}

.dnum{font-size:12px;font-weight:900;display:block}
.ddow{font-size:9px;font-weight:700}
.memo-txt{display:block;writing-mode:vertical-rl;text-orientation:mixed;
  font-size:8px;color:#5C6BC0;line-height:1.2;max-height:24px;overflow:hidden}

/* PRINCIPAL ROW */
.pr-row td{background:#FFF8E8}
.pr-row .cc{background:#FFF3DC;color:#E65100;font-size:10px}
.pr-row .cn{background:#FFF8E8;font-weight:800;font-size:11px;color:#E65100}
.pr-row .cd{background:#FFF8E8}
.prin-mark{font-size:12px;color:#E65100;font-weight:900}

/* CLASS NAME CELL */
.cls-cell{background:#E8EAF6;writing-mode:vertical-rl;text-orientation:mixed;
  transform:rotate(180deg);font-size:9px;font-weight:900;color:#3949AB;
  text-align:center;padding:4px 2px;border-right:2px solid #9FA8DA}

/* STAFF NAME CELL */
.name-cell{font-size:11px;font-weight:700;color:var(--text)}
.code-cell{font-size:9px;color:#78909C;font-weight:700}
.mat-row td{background:#FFF0F5;opacity:.6}
.mat-badge{font-size:7px;color:#E91E63;background:#FCE4EC;border-radius:3px;
  padding:0 2px;margin-left:2px;vertical-align:super}

/* DATA CELLS */
.c-edit{cursor:pointer}
.c-edit:hover{filter:brightness(.93)}
.c-empty{cursor:pointer}
.c-empty:hover{background:#E3F2FD}
.c-sun,.c-hol{background:#FFF0F0;cursor:default}
/* 土曜：出勤 */
.c-sat-on{background:#DBEEFF;color:#1565C0;font-size:10px;font-weight:900;cursor:pointer}
.c-sat-on:hover{filter:brightness(.93)}
/* 土曜：欠勤 */
.c-sat-off{background:#FAFAFA;color:#BDBDBD;font-size:9px;cursor:pointer}
.c-sat-off:hover{background:#EEF4FF}
.c-mat{background:#FFF0F5}
.c-prin{cursor:pointer}
.c-prin:hover{background:#FFF3DC}

/* SHIFT BACKGROUNDS */
.bg-a1{background:#FFCCBC;color:#BF360C}
.bg-a5{background:#FFE0B2;color:#E65100}
.bg-e {background:#FFF9C4;color:#E65100}
.bg-f {background:#DCEDC8;color:#33691E}
.bg-g {background:#B2DFDB;color:#004D40}
.bg-ln{background:#BBDEFB;color:#0D47A1}
.bg-ly{background:#E1BEE7;color:#4A148C}

/* STATUS BACKGROUNDS */
.c-rest{background:#ECEFF1;color:#546E7A;font-size:10px;font-weight:900;cursor:pointer}
.c-trip{background:#FFF3E0;color:#E65100;font-size:10px;font-weight:900;cursor:pointer}
.c-nen {background:#F3E5F5;color:#6A1B9A;font-size:10px;font-weight:900;cursor:pointer}

/* LEGEND CARD */
.leg-card{background:white;border-radius:16px;padding:16px 20px;min-width:200px;
  box-shadow:0 8px 32px rgba(21,101,192,.18);
  animation:scIn .22s cubic-bezier(.22,1,.36,1)}
@keyframes scIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.leg-card-title{font-size:13px;font-weight:900;color:var(--text);margin-bottom:10px;text-align:center}
.leg-item{display:flex;align-items:center;gap:6px;margin-bottom:6px;white-space:nowrap}
.leg-badge{display:inline-block;border-radius:4px;padding:2px 6px;font-size:10px;font-weight:900;
  line-height:1.4;min-width:28px;text-align:center}
.leg-time{font-size:10px;color:#546E7A}

/* OVERLAY / SHEET */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,40,.42);z-index:200;
  align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.ov.open{display:flex;animation:bgIn .2s}
.ov-center{align-items:center}
@keyframes bgIn{from{opacity:0}to{opacity:1}}
.sheet{background:white;border-radius:24px 24px 0 0;width:100%;max-width:480px;
  max-height:90vh;overflow-y:auto;padding-bottom:24px;
  animation:shUp .3s cubic-bezier(.22,1,.36,1)}
@keyframes shUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.shdl{width:36px;height:5px;background:#E0E0E0;border-radius:100px;margin:10px auto}
.shhd{padding:4px 16px 11px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #F0F0F0}
.shtitle{font-size:14px;font-weight:900;color:var(--text)}
.shsub{font-size:10px;color:var(--text-sub);margin-top:1px}
.shclose{width:30px;height:30px;border-radius:50%;border:none;background:#F5F5F5;
  font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#90A4AE}
.shbody{padding:12px 16px 0}

/* SHIFT PICKER */
.spgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.spbtn{border:2px solid #EEE;border-radius:10px;padding:7px 2px;background:white;
  cursor:pointer;font-family:inherit;transition:all .17s;
  display:flex;flex-direction:column;align-items:center;gap:2px}
.spbtn:hover{border-color:var(--blue);background:#EBF4FF}
.spbtn.sel{border-color:var(--blue);background:#E3F2FD}
.spbtn.dis{opacity:.32;cursor:not-allowed;pointer-events:none}
.spbtn .sc{font-size:11px;font-weight:900;border-radius:4px;padding:1px 4px}
.spbtn .st{font-size:8px;color:#90A4AE;line-height:1.3;text-align:center}
.spbtn .sw{font-size:8px;color:#EF5350;line-height:1.3}

/* STATUS BUTTONS */
.strow{display:flex;gap:6px;margin-bottom:10px}
.stbtn{flex:1;border:2px solid #EEE;border-radius:10px;padding:8px 3px;
  background:white;cursor:pointer;font-family:inherit;font-size:11px;font-weight:700;
  transition:all .17s}
.stbtn:hover{border-color:#90A4AE}
.stbtn.sr{border-color:#78909C;background:#ECEFF1;color:#546E7A}
.stbtn.st2{border-color:#FF8F00;background:#FFF3E0;color:#E65100}
.stbtn.sn{border-color:#7B1FA2;background:#F3E5F5;color:#6A1B9A}

/* SETTINGS TABS */
.stab-row{display:flex;border-bottom:2px solid #EEE;margin-bottom:12px}
.stab{flex:1;padding:8px 0;border:none;background:none;font-size:12px;font-weight:700;
  color:#90A4AE;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;
  font-family:inherit;transition:all .17s}
.stab.active{color:var(--blue);border-bottom-color:var(--blue)}

/* CLASS SETTINGS */
.cls-row{display:flex;align-items:center;gap:7px;padding:7px 0;border-bottom:1px solid #F0F0F0}
.cls-key{font-size:10px;font-weight:700;background:#E3F2FD;color:#1565C0;
  border-radius:5px;padding:2px 5px;white-space:nowrap;min-width:28px;text-align:center;flex-shrink:0}
.cls-ni{flex:1;border:1.5px solid #DDEEFF;border-radius:8px;
  padding:4px 8px;font-size:12px;font-family:inherit;outline:none}
.cls-ni:focus{border-color:var(--blue)}
.cnt-box{display:flex;align-items:center;gap:4px;flex-shrink:0}
.cnt-num{font-size:13px;font-weight:900;color:var(--text);min-width:18px;text-align:center}
.cnt-btn{width:24px;height:24px;border-radius:6px;border:none;background:#E3F2FD;
  color:var(--blue);font-size:16px;font-weight:900;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .17s}
.cnt-btn:hover{background:var(--blue);color:white}
.cnt-btn:disabled{background:#EEE;color:#B0BEC5;cursor:not-allowed}

/* STAFF SETTINGS */
.sr-row{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid #F0F0F0}
.sr-cls{font-size:9px;font-weight:700;padding:1px 4px;border-radius:4px;
  background:#E3F2FD;color:#1565C0;white-space:nowrap;min-width:28px;text-align:center;flex-shrink:0}
.sr-ni{flex:1;border:1.5px solid #DDEEFF;border-radius:7px;
  padding:4px 7px;font-size:12px;font-family:inherit;outline:none;min-width:0}
.sr-ni:focus{border-color:var(--blue)}
.sr-code{width:36px;border:1.5px solid #DDEEFF;border-radius:7px;
  padding:4px 4px;font-size:11px;font-family:inherit;outline:none;text-align:center}
.sr-code:focus{border-color:var(--blue)}
.mtog{width:36px;height:20px;border-radius:100px;border:none;cursor:pointer;
  position:relative;transition:background .2s;flex-shrink:0}
.mtog::after{content:'';position:absolute;top:2px;left:2px;
  width:16px;height:16px;border-radius:50%;background:white;transition:left .2s}
.mtog.on{background:#E91E63}.mtog.on::after{left:18px}
.mtog.off{background:#B0BEC5}

/* HOLIDAY SETTINGS */
.hol-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.hol-dow{text-align:center;font-size:10px;font-weight:700;color:#90A4AE;padding:3px 0}
.hol-day{padding:6px 0;border:1.5px solid #EEE;border-radius:8px;
  text-align:center;font-size:11px;font-weight:700;cursor:pointer;transition:all .17s}
.hol-day.marked{background:#FFEBEE;border-color:#EF5350;color:#C62828}
.hol-day.empty{background:#FAFAFA;color:#BDBDBD;cursor:default;border:none}

/* BUTTONS */
.btn{display:block;width:100%;padding:11px;border:none;border-radius:12px;
  font-size:13px;font-weight:900;cursor:pointer;transition:all .2s;font-family:inherit}
.btn+.btn{margin-top:6px}
.btn-blue{background:linear-gradient(135deg,#1565C0,#42A5F5);color:white;box-shadow:0 4px 14px rgba(33,150,243,.25)}
.btn-gray{background:#F5F5F5;color:#78909C}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#323232;color:white;border-radius:10px;padding:9px 18px;
  font-size:12px;font-weight:700;z-index:500;opacity:0;transition:all .3s;
  pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.hidden{display:none!important}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-top">
    <div class="hdr-title">📋 当番割り当て</div>
    <div class="hdr-btns">
      <button class="hbtn hbtn-auto" onclick="autoAssign()">🪄 自動作成</button>
      <button class="hbtn hbtn-csv"  onclick="exportCSV()">📥 CSV</button>
      <button class="hbtn hbtn-leg"  onclick="openLegend()">📋 凡例</button>
      <button class="hbtn hbtn-cfg"  onclick="openSettings()">⚙️</button>
    </div>
  </div>
  <div class="mnav">
    <button class="marr" onclick="changeMonth(-1)">‹</button>
    <div class="mlbl" id="mlbl"></div>
    <button class="marr" onclick="changeMonth(1)">›</button>
  </div>
</div>

<div class="twrap" id="twrap"></div>

<!-- LEGEND MODAL -->
<div class="ov ov-center" id="ov-leg" onclick="ovBg(event,'ov-leg')">
  <div class="leg-card">
    <div class="leg-card-title">シフト一覧</div>
    <div class="leg-item"><span class="leg-badge bg-a1">A1</span><span class="leg-time">7:15〜16:00</span></div>
    <div class="leg-item"><span class="leg-badge bg-a5">A5</span><span class="leg-time">7:25〜16:10</span></div>
    <div class="leg-item"><span class="leg-badge bg-e">E</span><span class="leg-time">8:25〜17:10</span></div>
    <div class="leg-item"><span class="leg-badge bg-f">F</span><span class="leg-time">8:30〜17:15</span></div>
    <div class="leg-item"><span class="leg-badge bg-g">G</span><span class="leg-time">8:45〜17:30</span></div>
    <div class="leg-item"><span class="leg-badge bg-ln">L1</span><span class="leg-time">10:00〜18:45</span></div>
    <div class="leg-item"><span class="leg-badge bg-ly">L2</span><span class="leg-time">10:00〜18:45</span></div>
  </div>
</div>

<!-- CELL EDIT MODAL -->
<div class="ov" id="ov-cell" onclick="ovBg(event,'ov-cell')">
  <div class="sheet">
    <div class="shdl"></div>
    <div class="shhd">
      <div><div class="shtitle" id="cell-title"></div><div class="shsub" id="cell-sub"></div></div>
      <button class="shclose" onclick="closeOv('ov-cell')">✕</button>
    </div>
    <div class="shbody">
      <div class="spgrid" id="spgrid"></div>
      <div class="strow">
        <button class="stbtn" id="btn-rest" onclick="setCellStatus('rest')">😴 休み</button>
        <button class="stbtn" id="btn-trip" onclick="setCellStatus('trip')">🚌 出張</button>
        <button class="stbtn" id="btn-nen"  onclick="setCellStatus('nenkyuu')">📅 年休</button>
        <button class="stbtn" onclick="setCellStatus('clear')">🗑️ クリア</button>
      </div>
    </div>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div class="ov" id="ov-cfg" onclick="ovBg(event,'ov-cfg')">
  <div class="sheet">
    <div class="shdl"></div>
    <div class="shhd">
      <div><div class="shtitle">⚙️ 設定</div></div>
      <button class="shclose" onclick="closeOv('ov-cfg')">✕</button>
    </div>
    <div class="shbody">
      <div class="stab-row">
        <button class="stab active" id="stab0" onclick="switchSettingsTab(0)">クラス</button>
        <button class="stab"        id="stab1" onclick="switchSettingsTab(1)">職員</button>
        <button class="stab"        id="stab2" onclick="switchSettingsTab(2)">祝日</button>
      </div>
      <div id="stab-content"></div>
      <button class="btn btn-blue" id="cfg-save-btn" onclick="saveSettings()">保存する</button>
      <button class="btn btn-gray" onclick="closeOv('ov-cfg')" style="margin-top:6px">閉じる</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════
   CONSTANTS
══════════════════════════════════════ */
const SHIFTS = ['A1','A5','E','F','G','L1','L2'];
const SHIFT_TIME = {A1:'7:15〜16:00',A5:'7:25〜16:10',E:'8:25〜17:10',
  F:'8:30〜17:15',G:'8:45〜17:30',L1:'10:00〜18:45',L2:'10:00〜18:45'};
const SHIFT_BG = {A1:'bg-a1',A5:'bg-a5',E:'bg-e',F:'bg-f',G:'bg-g',L1:'bg-ln',L2:'bg-ly'};
const EARLY = new Set(['A1','A5','E']);
const LATE  = new Set(['L1','L2','G']);
const DOW_JP = ['日','月','火','水','木','金','土'];
const CLASS_ORDER = ['管理','フリー','0歳','1歳','2歳','3歳','4歳','5歳'];
const CLASS_TYPE  = {'管理':'admin','フリー':'free','0歳':'nyuji','1歳':'nyuji','2歳':'nyuji','3歳':'yoji','4歳':'yoji','5歳':'yoji'};
const CLASS_PFX   = {'管理':'admin','フリー':'fr','0歳':'n0','1歳':'n1','2歳':'n2','3歳':'n3','4歳':'n4','5歳':'n5'};
const CIRCLE = ['','①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];
const REIWA_BASE = 2018;

const DEFAULT_STAFF = [
  {id:'fukuen',name:'副園長',cls:'管理',type:'admin',code:''},
  {id:'free',  name:'フリー',cls:'フリー',type:'free',code:''},
  {id:'n0_1',name:'0歳①',cls:'0歳',type:'nyuji',code:''},
  {id:'n0_2',name:'0歳②',cls:'0歳',type:'nyuji',code:''},
  {id:'n0_3',name:'0歳③',cls:'0歳',type:'nyuji',code:''},
  {id:'n0_4',name:'0歳④',cls:'0歳',type:'nyuji',code:''},
  {id:'n0_5',name:'0歳⑤',cls:'0歳',type:'nyuji',code:'',maternity:true},
  {id:'n1_1',name:'1歳①',cls:'1歳',type:'nyuji',code:''},
  {id:'n1_2',name:'1歳②',cls:'1歳',type:'nyuji',code:''},
  {id:'n1_3',name:'1歳③',cls:'1歳',type:'nyuji',code:''},
  {id:'n2_1',name:'2歳①',cls:'2歳',type:'nyuji',code:''},
  {id:'n2_2',name:'2歳②',cls:'2歳',type:'nyuji',code:''},
  {id:'n2_3',name:'2歳③',cls:'2歳',type:'nyuji',code:''},
  {id:'n3_1',name:'3歳①',cls:'3歳',type:'yoji',code:''},

function loadData(){
  try{ appData=JSON.parse(localStorage.getItem('tban2')||'null'); }catch(e){appData=null;}
  if(!appData) appData={staff:DEFAULT_STAFF.map(s=>({...s})),classNames:{},months:{}};
  if(!appData.classNames) appData.classNames={};
  DEFAULT_STAFF.forEach(ds=>{if(!appData.staff.find(s=>s.id===ds.id))appData.staff.push({...ds});});
}
function saveData(){localStorage.setItem('tban2',JSON.stringify(appData));}
function getS(id){return appData.staff.find(s=>s.id===id);}
function activeStaff(){return appData.staff.filter(s=>!s.maternity);}
function clsName(cls){return appData.classNames[cls]||cls;}
function getMD(y,m){
  const k=`${y}-${String(m+1).padStart(2,'0')}`;
  if(!appData.months[k])appData.months[k]={assignments:{},absences:{},principal:{},saturdayAttendance:{},dayMemos:{},holidays:[]};
  return appData.months[k];
}
function toDateStr(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function fromDate(s){return new Date(s+'T00:00:00');}
function todayStr(){return toDateStr(new Date());}
function getMonthDays(y,m){
  const days=[]; const d=new Date(y,m,1);
  while(d.getMonth()===m){days.push(toDateStr(d));d.setDate(d.getDate()+1);}
  return days;
}
function isHol(ds,md){return(md.holidays||[]).includes(ds);}
function reiwa(y){const r=y-REIWA_BASE;return r===1?'令和元年':`令和${r}年`;}

function render(){
  document.getElementById('mlbl').textContent=`${reiwa(curY)} ${String(curM+1).padStart(2,'0')}月`;
  renderTable();
}

function renderTable(){
  const days=getMonthDays(curY,curM);
  const md=getMD(curY,curM);
  const today=todayStr();

  const groups={};
  CLASS_ORDER.forEach(c=>{groups[c]=appData.staff.filter(s=>s.cls===c);});

  let h='<table>';
  // colgroup
  h+=`<colgroup><col style="width:54px"><col style="width:82px"><col style="width:22px">`;
  days.forEach(()=>h+='<col style="width:26px">');
  h+=`<col style="width:26px"></colgroup>`;

  // ── THEAD ──
  h+='<thead>';

  // Row 1: date numbers
  h+='<tr class="hr1">';
  h+=`<th class="cc" rowspan="3">クラス</th>`;
  h+=`<th class="cn" rowspan="3">職員名</th>`;
  h+=`<th class="cd" rowspan="3">CD</th>`;
  days.forEach(ds=>{
    const d=fromDate(ds);const dow=d.getDay();
    const sat=dow===6,sun=dow===0,hol=isHol(ds,md),tod=ds===today;
    let cls='hd';
    if(sat)cls+=' d-sat';else if(sun||hol)cls+=' d-sun';
    if(tod)cls+=' d-tod';
    h+=`<th class="${cls}"><span class="dnum">${d.getDate()}</span></th>`;
  });
  h+=`<th class="ctot" rowspan="3">計</th>`;
  h+='</tr>';

  // Row 2: day of week
  h+='<tr class="hr2">';
  days.forEach(ds=>{
    const d=fromDate(ds);const dow=d.getDay();
    const sat=dow===6,sun=dow===0,hol=isHol(ds,md);
    let cls='hd';
    if(sat)cls+=' d-sat';else if(sun||hol)cls+=' d-sun';
    h+=`<th class="${cls}"><span class="ddow">${DOW_JP[dow]}</span></th>`;
  });
  h+='</tr>';

  // Row 3: memos
  h+='<tr class="hr3">';
  days.forEach(ds=>{
    const d=fromDate(ds);const dow=d.getDay();
    const sat=dow===6,sun=dow===0,hol=isHol(ds,md);
    const canEdit=!sun&&!hol;
    const memo=(md.dayMemos||{})[ds]||'';
    let cls='hd';
    if(sat)cls+=' d-sat';else if(sun||hol)cls+=' d-sun';
    h+=`<th class="${cls}"${canEdit?` onclick="editMemo('${ds}')"`:''}>${memo?`<span class="memo-txt">${escH(memo)}</span>`:''}</th>`;
  });
  h+='</tr>';

  h+='</thead><tbody>';

  // ── PRINCIPAL ROW ──
  h+='<tr class="pr-row">';
  h+=`<td class="cc pr-row">園長</td>`;
  h+=`<td class="cn pr-row" style="font-weight:800;color:#E65100">園長</td>`;
  h+=`<td class="cd pr-row"></td>`;
  days.forEach(ds=>{
    const d=fromDate(ds);const dow=d.getDay();
    const sun=dow===0,hol=isHol(ds,md);
    if(sun||hol){h+=`<td class="c-sun"></td>`;return;}
    const marked=(md.principal||{})[ds];
    h+=`<td class="c-prin" onclick="togglePrin('${ds}')">${marked?'<span class="prin-mark">●</span>':''}</td>`;
  });
  h+=`<td class="ctot"></td>`;
  h+='</tr>';

  // ── STAFF ROWS ──
  CLASS_ORDER.forEach(cls=>{
    const staff=groups[cls]||[];
    if(!staff.length)return;
    const cname=clsName(cls);

    staff.forEach((s,idx)=>{
      const mat=!!s.maternity;
      h+=`<tr class="${mat?'mat-row':''}">`;

      if(idx===0){
        h+=`<td class="cc cls-cell" rowspan="${staff.length}">${escH(cname)}</td>`;
      }

      h+=`<td class="cn name-cell">${escH(s.name)}${mat?'<sup class="mat-badge">産</sup>':''}</td>`;
      h+=`<td class="cd code-cell">${escH(s.code||'')}</td>`;

      let count=0;
      days.forEach(ds=>{
        const d=fromDate(ds);const dow=d.getDay();
        const sun=dow===0,sat=dow===6,hol=isHol(ds,md);

        if(mat){h+=`<td class="c-mat"></td>`;return;}
        if(sun||hol){h+=`<td class="c-sun"></td>`;return;}

        // 土曜：出勤/欠勤トグルのみ
        if(sat){
          const satAtt=(md.saturdayAttendance||{})[ds]||[];
          const attending=satAtt.includes(s.id);
          if(attending){
            h+=`<td class="c-sat-on" onclick="toggleSatCell('${ds}','${s.id}')">出</td>`;
          }else{
            h+=`<td class="c-sat-off" onclick="toggleSatCell('${ds}','${s.id}')">－</td>`;
          }
          return;
        }

        const abs=(md.absences||{})[ds]?.[s.id];
        if(abs){
          const lbl=abs==='rest'?'休':abs==='nenkyuu'?'年':'出';
          const bc=abs==='rest'?'c-rest':abs==='nenkyuu'?'c-nen':'c-trip';
          h+=`<td class="${bc} c-edit" onclick="openCell('${ds}','${s.id}')">${lbl}</td>`;return;
        }

        const asgn=(md.assignments||{})[ds]||{};
        const shift=Object.entries(asgn).find(([,id])=>id===s.id)?.[0];
        if(shift){
          count++;
          h+=`<td class="${SHIFT_BG[shift]||''} c-edit" onclick="openCell('${ds}','${s.id}')" style="font-size:10px;font-weight:900">${shift}</td>`;
        }else{
          h+=`<td class="c-empty c-edit" onclick="openCell('${ds}','${s.id}')"></td>`;
        }
      });

      h+=`<td class="ctot">${count||''}</td>`;
      h+='</tr>';
    });
  });

  h+='</tbody></table>';
  document.getElementById('twrap').innerHTML=h;
}

function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function openCell(ds,sid){
  const s=getS(sid);if(!s||s.maternity)return;
  const d=fromDate(ds);const dow=d.getDay();
  if(dow===6)return; // 土曜はtoggleSatCellで処理
  const md=getMD(curY,curM);
  editDate=ds;editSid=sid;

  const abs=(md.absences||{})[ds]?.[sid];
  const asgn=(md.assignments||{})[ds]||{};
  const curShift=Object.entries(asgn).find(([,id])=>id===sid)?.[0];

  document.getElementById('cell-title').textContent=
    `${d.getMonth()+1}月${d.getDate()}日（${DOW_JP[dow]}） ${s.name}`;
  document.getElementById('cell-sub').textContent=
    curShift?`現在: ${curShift}`:abs?`現在: ${abs==='rest'?'休み':abs==='nenkyuu'?'年休':'出張'}`:'未割り当て';

  let sg='';
  SHIFTS.forEach(sh=>{
    const takenId=asgn[sh];
    const takenBySomeone=takenId&&takenId!==sid;
    const notElig=!isEligible(s,sh);
    const clsConf=!noClassConflict(s,sh,asgn);
    const dis=takenBySomeone||notElig||clsConf;
    const note=takenBySomeone?escH(getS(takenId)?.name||''):notElig?'対象外':clsConf?'クラス重複':'';
    const sel=curShift===sh?' sel':'';
    sg+=`<button class="spbtn${sel}${dis?' dis':''}" ${dis?'disabled':''} onclick="pickShift('${sh}')">
      <span class="sc ${SHIFT_BG[sh]}">${sh}</span>
      <span class="st">${SHIFT_TIME[sh]}</span>
      ${note?`<span class="sw">${note}</span>`:''}
    </button>`;
  });
  document.getElementById('spgrid').innerHTML=sg;

  document.getElementById('btn-rest').className='stbtn'+(abs==='rest'?' sr':'');
  document.getElementById('btn-trip').className='stbtn'+(abs==='trip'?' st2':'');
  document.getElementById('btn-nen').className='stbtn'+(abs==='nenkyuu'?' sn':'');
  document.getElementById('ov-cell').classList.add('open');
}

function pickShift(sh){
  const md=getMD(curY,curM);
  if(!md.assignments[editDate])md.assignments[editDate]={};
  Object.keys(md.assignments[editDate]).forEach(k=>{
    if(md.assignments[editDate][k]===editSid)delete md.assignments[editDate][k];
  });
  delete md.assignments[editDate][sh];
  md.assignments[editDate][sh]=editSid;
  if(md.absences[editDate])delete md.absences[editDate][editSid];
  saveData();closeOv('ov-cell');renderTable();
}

function setCellStatus(status){
  const md=getMD(curY,curM);
  if(status==='clear'){
    if(md.absences[editDate])delete md.absences[editDate][editSid];
    if(md.assignments[editDate]){
      Object.keys(md.assignments[editDate]).forEach(k=>{
        if(md.assignments[editDate][k]===editSid)delete md.assignments[editDate][k];
      });
    }
  }else{
    if(!md.absences[editDate])md.absences[editDate]={};
    md.absences[editDate][editSid]=status;
    if(md.assignments[editDate]){
      Object.keys(md.assignments[editDate]).forEach(k=>{
        if(md.assignments[editDate][k]===editSid)delete md.assignments[editDate][k];
      });
    }
  }
  saveData();closeOv('ov-cell');renderTable();
}

function togglePrin(ds){
  const md=getMD(curY,curM);
  if(md.principal[ds])delete md.principal[ds];else md.principal[ds]=true;
  saveData();renderTable();
}

function editMemo(ds){
  const md=getMD(curY,curM);

  const val=prompt(`${d.getMonth()+1}月${d.getDate()}日のメモ（行事・会議名など）`,cur);

   AUTO ASSIGN（土曜はスキップ）
══════════════════════════════════════ */
function isEligible(s,shift){
  return true; // 全シフト全員対応
}
function noClassConflict(s,shift,dayAsgn){
  if(s.cls==='管理'||s.cls==='フリー')return true;
  const isE=EARLY.has(shift),isL=LATE.has(shift);
  if(!isE&&!isL)return true;
  for(const[sh,sid]of Object.entries(dayAsgn)){
    const s2=getS(sid);if(!s2||s2.cls!==s.cls)continue;
    if(isE&&EARLY.has(sh))return false;
    if(isL&&LATE.has(sh))return false;
  }
  return true;
}
function getAvailWeekday(ds,md){
  let pool=activeStaff();
  const abs=(md.absences||{})[ds]||{};
  pool=pool.filter(s=>!abs[s.id]);
  if((md.principal||{})[ds])pool=pool.filter(s=>s.id!=='fukuen');
  return pool;
}
function getPrevWD(ds){
  const d=fromDate(ds);
  d.setDate(d.getDate()-1);
  while(d.getDay()===0)d.setDate(d.getDate()-1);
  return toDateStr(d);
}

// shiftCounts[staffId][shiftType] = 回数
function calcScore(s,shift,ds,dow,counts,shiftCounts,lastDuty,dowHist,eligPool){
  let sc=0;
  // 【最高優先】そのシフト種別の担当回数が少ない人を優先
  const myShiftCnt=(shiftCounts[s.id]||{})[shift]||0;
  const avgShiftCnt=eligPool.reduce((sum,p)=>sum+((shiftCounts[p.id]||{})[shift]||0),0)/eligPool.length;
  sc+=(avgShiftCnt-myShiftCnt)*60;
  // 【高】総当番回数が少ない人を優先
  const avgTot=eligPool.reduce((sum,p)=>sum+(counts[p.id]||0),0)/eligPool.length;
  sc+=(avgTot-(counts[s.id]||0))*20;
  // 【高】連日ペナルティ
  if(lastDuty[s.id]===getPrevWD(ds))sc-=50;
  // 【中】曜日偏りペナルティ
  sc-=(dowHist[s.id]?.[dow]||0)*12;
  // 微小乱数（完全同点を避ける）
  sc+=Math.random()*2;
  return sc;
}

function autoAssign(){
  if(!confirm('当番を自動作成します。この月の既存当番データは上書きされます。よろしいですか？'))return;
  const md=getMD(curY,curM);
  md.assignments={};
  const days=getMonthDays(curY,curM);
  const counts={};       // staffId → 総当番回数
  const shiftCounts={};  // staffId → {shiftType: 回数}
  const lastDuty={};
  const dowHist={};
  activeStaff().forEach(s=>{
    counts[s.id]=0;
    shiftCounts[s.id]={};
    SHIFTS.forEach(sh=>{shiftCounts[s.id][sh]=0;});
    dowHist[s.id]={};
  });
  const warns=[];
  // シフト種別ごとの均等化のため、各日の割り当て順をランダム化
  const shiftOrder=[...SHIFTS];

  for(const ds of days){
    const d=fromDate(ds);const dow=d.getDay();
    if(dow===6||dow===0||isHol(ds,md))continue;
    const avail=getAvailWeekday(ds,md);
    if(!avail.length)continue;
    const dayAsgn={};const used=new Set();

    // シフトごとに担当回数の少ない人から割り当てる
    // 割り当て順：各シフトの平均担当回数が多いシフトから先に（不足しがちなシフトを先処理）
    const orderedShifts=[...SHIFTS].sort((a,b)=>{
      const avgA=avail.reduce((s,p)=>s+(shiftCounts[p.id]?.[a]||0),0)/avail.length;
      const avgB=avail.reduce((s,p)=>s+(shiftCounts[p.id]?.[b]||0),0)/avail.length;
      return avgA-avgB; // 平均が少ないシフトを先に割り当て
    });

    for(const shift of orderedShifts){
      const elig=avail.filter(s=>!used.has(s.id)&&noClassConflict(s,shift,dayAsgn));
      if(!elig.length){warns.push(`${d.getMonth()+1}/${d.getDate()} ${shift}`);continue;}
      const scored=elig.map(s=>({s,score:calcScore(s,shift,ds,dow,counts,shiftCounts,lastDuty,dowHist,elig)}));
      scored.sort((a,b)=>b.score-a.score);
      const chosen=scored[0].s;
      dayAsgn[shift]=chosen.id;used.add(chosen.id);
      counts[chosen.id]=(counts[chosen.id]||0)+1;
      shiftCounts[chosen.id][shift]=(shiftCounts[chosen.id][shift]||0)+1;
      lastDuty[chosen.id]=ds;
      dowHist[chosen.id][dow]=(dowHist[chosen.id][dow]||0)+1;
    }
    if(Object.keys(dayAsgn).length)md.assignments[ds]=dayAsgn;
  }
  saveData();renderTable();
  if(warns.length)alert('⚠️ 割り当て不足:\n'+warns.join('\n'));
  else showToast('自動作成完了！ ✨');
}

function addStaff(cls){
  const clsStaff=appData.staff.filter(s=>s.cls===cls);
  const n=clsStaff.length+1;
  const pfx=CLASS_PFX[cls]||cls;
  const newId=`${pfx}_${Date.now()}`;
  const num=CIRCLE[n]||`(${n})`;
  const type=CLASS_TYPE[cls]||'nyuji';
  appData.staff.push({id:newId,name:`${cls}${num}`,cls,type,code:''});
  saveData();
  const cnt=document.getElementById(`cnt-${cls}`);
  if(cnt)cnt.textContent=appData.staff.filter(s=>s.cls===cls).length;
  showToast(`${clsName(cls)}に${cls}${num}を追加しました`);
}

function removeStaff(cls){
  const clsStaff=appData.staff.filter(s=>s.cls===cls);
  if(clsStaff.length<=1){showToast('最低1名は必要です');return;}
  const last=clsStaff[clsStaff.length-1];
  if(!confirm(`「${last.name}」を削除しますか？\nこの職員の当番データもすべて削除されます。`))return;
  appData.staff.splice(appData.staff.findIndex(s=>s.id===last.id),1);
  Object.values(appData.months).forEach(md=>{
    Object.values(md.assignments||{}).forEach(da=>{
      Object.keys(da).forEach(sh=>{if(da[sh]===last.id)delete da[sh];});
    });
    Object.values(md.absences||{}).forEach(da=>{delete da[last.id];});
    Object.keys(md.saturdayAttendance||{}).forEach(ds=>{
      const arr=md.saturdayAttendance[ds];
      const i=arr.indexOf(last.id);if(i>-1)arr.splice(i,1);
    });
  });
  saveData();
  const cnt=document.getElementById(`cnt-${cls}`);
  if(cnt)cnt.textContent=appData.staff.filter(s=>s.cls===cls).length;
  showToast(`${last.name}を削除しました`);
}

}

function toggleMat(id){
  const btn=document.getElementById('mt-'+id);
  const on=btn.classList.contains('on');
  btn.classList.toggle('on',!on);btn.classList.toggle('off',on);
}

/* ── HOLIDAY TAB ── */
function buildHolTab(){
  const md=getMD(curY,curM);
  const hols=md.holidays||[];
  const days=getMonthDays(curY,curM);
  const firstDow=fromDate(days[0]).getDay();
  let h=`<div style="margin-bottom:8px;font-size:12px;color:#546E7A">祝日（当番なし）をタップで設定</div>`;
  h+='<div class="hol-grid">';
  DOW_JP.forEach(d=>h+=`<div class="hol-dow">${d}</div>`);
  for(let i=0;i<firstDow;i++)h+=`<div class="hol-day empty"></div>`;
  days.forEach(ds=>{
    const d=fromDate(ds);const dow=d.getDay();
    const marked=hols.includes(ds);
    const isSun=dow===0;
    h+=`<div class="hol-day${marked?' marked':''}${isSun?' d-sun':''}" onclick="toggleHol('${ds}')">${d.getDate()}</div>`;
  });
  h+='</div>';
  return h;
}

function toggleHol(ds){
  const md=getMD(curY,curM);
  if(!md.holidays)md.holidays=[];
  const i=md.holidays.indexOf(ds);
  if(i>-1)md.holidays.splice(i,1);else md.holidays.push(ds);
  saveData();
  document.getElementById('stab-content').innerHTML=buildHolTab();
}

function saveSettings(){
  ['フリー','0歳','1歳','2歳','3歳','4歳','5歳'].forEach(cls=>{
    const inp=document.getElementById(`cni-${cls}`);
    if(inp){
      const v=inp.value.trim();
      if(v&&v!==cls)appData.classNames[cls]=v;
      else delete appData.classNames[cls];
    }
  });
  appData.staff.forEach(s=>{
    const ni=document.getElementById('sni-'+s.id);
    if(ni)s.name=ni.value.trim()||s.name;
    const cd=document.getElementById('scd-'+s.id);
    if(cd)s.code=cd.value.trim();
    const mt=document.getElementById('mt-'+s.id);
    if(mt)s.maternity=mt.classList.contains('on');
  });
  saveData();closeOv('ov-cfg');renderTable();showToast('設定を保存しました');
}

/* ══════════════════════════════════════
   CSV EXPORT
══════════════════════════════════════ */
function exportCSV(){
  const md=getMD(curY,curM);
  const days=getMonthDays(curY,curM);
  const hdr=['クラス','職員名','CD',
    ...days.map(ds=>{const d=fromDate(ds);return`${d.getMonth()+1}/${d.getDate()}(${DOW_JP[d.getDay()]})`;}),
    '合計'];
  const rows=[hdr];

  rows.push(['','園長','',
    ...days.map(ds=>{
      const d=fromDate(ds);const dow=d.getDay();
      if(dow===0||isHol(ds,md))return'';
      return(md.principal||{})[ds]?'●':'';
    }),'']);

  appData.staff.forEach(s=>{
    let count=0;
    const cells=days.map(ds=>{
      const d=fromDate(ds);const dow=d.getDay();
      if(s.maternity)return'産休';
      if(dow===0||isHol(ds,md))return'';
      if(dow===6){
        const satAtt=(md.saturdayAttendance||{})[ds]||[];
        return satAtt.includes(s.id)?'出':'－';
      }
      const abs=(md.absences||{})[ds]?.[s.id];
      if(abs)return abs==='rest'?'休み':abs==='nenkyuu'?'年休':'出張';
      const asgn=(md.assignments||{})[ds]||{};
      const shift=Object.entries(asgn).find(([,id])=>id===s.id)?.[0];
      if(shift){count++;return shift;}
      return'';
    });
    rows.push([clsName(s.cls),s.name,s.code||'',...cells,count]);
  });

  const bom='\uFEFF';
  const csv=bom+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=`当番表_${reiwa(curY)}${curM+1}月.csv`;
  a.click();
}

/* ══════════════════════════════════════

function changeMonth(d){
  curM+=d;
  if(curM<0){curM=11;curY--;}
  if(curM>11){curM=0;curY++;}
  render();
}
function ovBg(e,id){if(e.target.id===id)closeOv(id);}
function closeOv(id){document.getElementById(id).classList.remove('open');}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2400);
}
